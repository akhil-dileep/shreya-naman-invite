name: Invitation quality checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline and external JavaScript syntax, content, assets and backend policy
        run: node tests/smoke.test.mjs
